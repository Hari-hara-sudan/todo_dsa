<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA Problems - TODO Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            background: #667eea;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button.secondary {
            background: #6c757d;
        }

        button.secondary:hover {
            background: #5a6268;
        }

        button.danger {
            background: #dc3545;
        }

        button.danger:hover {
            background: #c82333;
        }

        .categories {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .category {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .category:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
        }

        .category-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .category-title {
            font-size: 18px;
            font-weight: 700;
        }

        .category-count {
            font-size: 13px;
            opacity: 0.9;
        }

        .category-progress {
            background: white;
            padding: 20px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #666;
        }

        .category-progress-bar {
            flex: 1;
            margin: 0 15px;
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            overflow: hidden;
        }

        .category-problems {
            padding: 15px 20px;
            max-height: 500px;
            overflow-y: auto;
        }

        .problem {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.2s;
        }

        .problem:last-child {
            border-bottom: none;
        }

        .problem:hover {
            background: #f8f9fa;
            padding: 12px 8px;
            border-radius: 4px;
        }

        .problem-checkbox {
            margin-top: 3px;
            cursor: pointer;
            width: 20px;
            height: 20px;
            accent-color: #667eea;
        }

        .problem-info {
            flex: 1;
            min-width: 0;
        }

        .problem-text {
            font-size: 14px;
            color: #333;
            margin-bottom: 4px;
            word-break: break-word;
        }

        .problem.completed .problem-text {
            color: #999;
            text-decoration: line-through;
        }

        .problem-link {
            color: #667eea;
            text-decoration: none;
            font-size: 12px;
            word-break: break-all;
        }

        .problem-link:hover {
            text-decoration: underline;
        }

        .problem.completed .problem-link {
            color: #ccc;
        }

        .problem-delete {
            background: #dc3545;
            color: white;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            flex-shrink: 0;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .problem:hover .problem-delete {
            opacity: 1;
        }

        .problem-delete:hover {
            background: #c82333;
        }

        .empty-message {
            text-align: center;
            color: #999;
            padding: 40px 20px;
            font-size: 14px;
        }

        .success-message {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .filter-buttons button {
            padding: 8px 16px;
            font-size: 13px;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .filter-buttons button.active {
            background: #667eea;
            color: white;
        }

        @media (max-width: 768px) {
            .categories {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .problem-delete {
                opacity: 1;
            }
        }
    </style>
</head>

                <div class="stat-box">

                <div class="stat-box">

                    <div class="progress-bar">

            <div class="controls">
                <button onclick="resetAllProgress()" class="danger">Reset All Progress</button>
                <button onclick="exportProgress()" class="secondary">Export Progress</button>
                <button onclick="printAllProblems()" class="secondary">Print All</button>
            </div>
        </header>

        <div class="filter-buttons">
            <button class="active" onclick="filterProblems('all')">All Problems</button>
            <button onclick="filterProblems('incomplete')">To Do</button>
            <button onclick="filterProblems('completed')">Completed</button>

        <div class="categories" id="categoriesContainer"></div>
    </div>

        let progress = {};
        let currentFilter = 'all';

        function initializeProgress() {
            const savedProgress = localStorage.getItem(STORAGE_KEY);
            if (savedProgress) {
                progress = JSON.parse(savedProgress);
            } else {
                Object.keys(problems).forEach(category => {
                    progress[category] = problems[category].map(() => false);
                });
                saveProgress();
            }
            render();
        }

        function saveProgress() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
            showSuccessMessage();
        }

        function showSuccessMessage() {
            const msg = document.getElementById('successMessage');
            msg.classList.add('show');
            setTimeout(() => msg.classList.remove('show'), 2000);
        }

        function toggleProblem(category, index) {
            progress[category][index] = !progress[category][index];
            saveProgress();
            render();
        }

        function deleteProblem(category, index) {
            progress[category][index] = false;
            saveProgress();
            render();
        }

        function getStats() {
            let total = 0, completed = 0;
            Object.keys(problems).forEach(category => {
                total += problems[category].length;
                completed += progress[category].filter(p => p).length;
            });
            const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
            return { total, completed, percent, inProgress: total - completed };
        }

        function updateStats() {
            const { total, completed, percent, inProgress } = getStats();
            document.getElementById('totalStat').textContent = total;
            document.getElementById('completedStat').textContent = completed;
            document.getElementById('inProgressStat').textContent = inProgress;
            document.getElementById('percentStat').textContent = percent + '%';
            document.getElementById('overallProgressBar').style.width = percent + '%';
        }

        function filterProblems(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-buttons button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            render();
        }

        function shouldShowProblem(isCompleted) {
            if (currentFilter === 'all') return true;
            if (currentFilter === 'completed') return isCompleted;
            if (currentFilter === 'incomplete') return !isCompleted;
            return true;
        }

        function render() {
            const container = document.getElementById('categoriesContainer');
            container.innerHTML = '';

            Object.keys(problems).forEach((category) => {
                const categoryProblems = problems[category];
                const categoryProgress = progress[category];
                const completed = categoryProgress.filter(p => p).length;
                const total = categoryProblems.length;
                const percent = total > 0 ? Math.round((completed / total) * 100) : 0;

                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'category';

                const header = document.createElement('div');
                header.className = 'category-header';
                header.innerHTML = `
                    <div>
                        <div class="category-title">${category}</div>
                        <div class="category-count">${completed}/${total} completed</div>
                    </div>
                `;

                const progressDiv = document.createElement('div');
                progressDiv.className = 'category-progress';
                progressDiv.innerHTML = `
                    <span>${percent}%</span>
                    <div class="category-progress-bar">
                        <div class="progress-fill" style="width: ${percent}%; background: linear-gradient(90deg, #667eea, #764ba2);"></div>
                    </div>
                    <span>${completed}/${total}</span>
                `;

                const problemsDiv = document.createElement('div');
                problemsDiv.className = 'category-problems';

                let hasVisibleProblems = false;
                categoryProblems.forEach((problem, index) => {
                    const isCompleted = categoryProgress[index];
                    if (!shouldShowProblem(isCompleted)) return;
                    hasVisibleProblems = true;

                    const problemDiv = document.createElement('div');
                    problemDiv.className = 'problem' + (isCompleted ? ' completed' : '');

                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.className = 'problem-checkbox';
                    checkbox.checked = isCompleted;
                    checkbox.onchange = () => toggleProblem(category, index);

                    const infoDiv = document.createElement('div');
                    infoDiv.className = 'problem-info';

                    const titleDiv = document.createElement('div');
                    titleDiv.className = 'problem-text';
                    titleDiv.textContent = problem.title;
                    infoDiv.appendChild(titleDiv);

                    if (problem.url) {
                        const linkDiv = document.createElement('a');
                        linkDiv.href = problem.url;
                        linkDiv.target = '_blank';
                        linkDiv.rel = 'noopener noreferrer';
                        linkDiv.className = 'problem-link';
                        linkDiv.textContent = 'View Solution →';
                        infoDiv.appendChild(linkDiv);
                    }

                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'problem-delete';
                    deleteBtn.textContent = '×';
                    deleteBtn.onclick = () => deleteProblem(category, index);

                    problemDiv.appendChild(checkbox);
                    problemDiv.appendChild(infoDiv);
                    problemDiv.appendChild(deleteBtn);
                    problemsDiv.appendChild(problemDiv);
                });

                if (!hasVisibleProblems) {
                    const emptyDiv = document.createElement('div');
                    emptyDiv.className = 'empty-message';
                    emptyDiv.textContent = currentFilter === 'completed' ? 'No completed problems yet' : 'All problems completed!';
                    problemsDiv.appendChild(emptyDiv);
                }

                categoryDiv.appendChild(header);
                categoryDiv.appendChild(progressDiv);
                categoryDiv.appendChild(problemsDiv);
                container.appendChild(categoryDiv);
            });

            updateStats();
        }

        function resetAllProgress() {
            if (confirm('Are you sure you want to reset all progress? This cannot be undone.')) {
                Object.keys(progress).forEach(category => {
                    progress[category] = problems[category].map(() => false);
                });
                saveProgress();
                render();
            }
        }

        function exportProgress() {
            const { total, completed, percent } = getStats();
            const timestamp = new Date().toLocaleString();
            let exportText = `DSA Problems Progress Report\n`;
            exportText += `Generated: ${timestamp}\n`;
            exportText += `Overall Progress: ${completed}/${total} (${percent}%)\n\n`;

            Object.keys(problems).forEach(category => {
                const categoryProgress = progress[category];
                const completed = categoryProgress.filter(p => p).length;
                const total = categoryProgress.length;
                exportText += `\n${category} (${completed}/${total}):\n`;
                exportText += `${'='.repeat(50)}\n`;
                problems[category].forEach((problem, index) => {
                    const status = categoryProgress[index] ? '✓' : '○';
                    exportText += `${status} ${problem.title}\n`;
                });
            });

            const blob = new Blob([exportText], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `dsa-progress-${new Date().toISOString().split('T')[0]}.txt`;
            a.click();
            window.URL.revokeObjectURL(url);
        }

        function printAllProblems() {
            window.print();
        }

        window.addEventListener('DOMContentLoaded', initializeProgress);
    </script>
</body>
</html>
